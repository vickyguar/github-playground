[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argentina-data-lab"
version = "0.1.0"
description = "A CLI for exploring Argentine public statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
argentina-data-lab = "argentina_data_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/argentina_data_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
